  # NEW service: fresh official chatterbox clone with turbo(EN)+multilingual routing.
  # Registers the `chatterbox-streaming-multilingual` network alias so the existing
  # Caddy upstream (/tts -> chatterbox-streaming-multilingual:8010) keeps resolving
  # with no Caddyfile change.
  chatterbox-turbo-multilingual:
    image: python:3.10
    working_dir: /home/ubuntu/chatterbox-turbo-multilingual
    cpus: "3.0"
    command: >-
      bash -lc "python -m ensurepip --upgrade &&
      python -m pip install --root-user-action=ignore 'setuptools<81' &&
      python -m pip install --root-user-action=ignore --extra-index-url https://download.pytorch.org/whl/cu124 torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 &&
      python -m pip install --root-user-action=ignore -e '.[server]' &&
      export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(find /usr/local/lib/python3.10/site-packages/nvidia -name lib -type d | tr '\n' ':') &&
      python -m uvicorn streaming_api:app --host 0.0.0.0 --workers 1 --port 8010 &
      UVICORN_PID=$$! &&
      timeout 900 bash -lc 'until python -c \"import urllib.request; urllib.request.urlopen(\\\"http://127.0.0.1:8010/health\\\", timeout=2)\" >/dev/null 2>&1; do sleep 1; done' &&
      (curl -fsS --max-time 1800 http://127.0.0.1:8010/warmup >/dev/null && echo 'Warmup GET status: 200') ||
      (curl -fsS -X POST --max-time 1800 http://127.0.0.1:8010/warmup >/dev/null && echo 'Warmup POST status: 200') ||
      echo 'Warmup skipped due to non-2xx response' &&
      wait $$UVICORN_PID"
    ports:
      - "8010:8010"
    environment:
      - PIP_ROOT_USER_ACTION=ignore
      - CHATTERBOX_MODELS_CONFIG=/home/ubuntu/chatterbox-turbo-multilingual/models_config.json
      # Persist HF downloads (turbo + any pretrained multilingual) to the named volume.
      - HF_HOME=/hf_cache
      # Set if ResembleAI/chatterbox-turbo is gated for your account.
      - HF_TOKEN=${HF_TOKEN:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OMP_NUM_THREADS=3
      - OPENBLAS_NUM_THREADS=3
      - MKL_NUM_THREADS=3
      - NUMEXPR_NUM_THREADS=3
      - TORCH_NUM_THREADS=3
      - TORCH_NUM_INTEROP_THREADS=1
      - CUDA_MPS_PIPE_DIRECTORY=/tmp/nvidia-mps
      - CUDA_MPS_LOG_DIRECTORY=/tmp/nvidia-log
      - CUDA_LAUNCH_BLOCKING=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 600s
    ipc: host
    networks:
      chatterbox-network:
        aliases:
          - chatterbox-streaming-multilingual
    gpus: all
    volumes:
      - ../chatterbox-turbo-multilingual:/home/ubuntu/chatterbox-turbo-multilingual
      - hf_cache:/hf_cache
      - /tmp/nvidia-mps:/tmp/nvidia-mps
      - /tmp/nvidia-log:/tmp/nvidia-log
    restart: unless-stopped

# Define the named volumes
volumes:
  hf_cache:
  caddy_config:
  caddy_data:

# Define the network for service communication
networks:
  chatterbox-network:
    driver: bridge
  stt-network:
    external: true
    name: stt_default
