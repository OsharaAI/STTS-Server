services:
  # Caddy reverse proxy for HTTPS
  caddy:
    image: caddy:2-alpine
    command: sh -c "apk add --no-cache nss-tools && caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - chatterbox-network
      - stt-network
    depends_on:
      - chatterbox-turbo-multilingual
    # Ensure the container can reach services bound to the Docker host (ASR/TTS)
    extra_hosts:
      - "host.docker.internal:host-gateway"

